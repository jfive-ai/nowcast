name: Nowcast
options:
  bundleIdPrefix: com.jfive-ai
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.6"
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.11.0"
  FeedKit:
    url: https://github.com/nmdias/FeedKit
    from: "10.4.0"
targets:
  Nowcast:
    type: application
    platform: macOS
    sources:
      - path: Nowcast
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Nowcast/Resources
    info:
      path: Nowcast/Resources/Info.plist
      properties:
        CFBundleName: Nowcast
        CFBundleDisplayName: Nowcast
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.news
        NSHumanReadableCopyright: ""
        SUFeedURL: "$(NOWCAST_APPCAST_URL)"
        SUPublicEDKey: "$(NOWCAST_SPARKLE_PUBLIC_KEY)"
        SUEnableInstallerLauncherService: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: Nowcast/Resources/Nowcast.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - "$(PRODUCT_BUNDLE_IDENTIFIER)-spks"
          - "$(PRODUCT_BUNDLE_IDENTIFIER)-spki"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jfive-ai.nowcast
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        NOWCAST_APPCAST_URL: ""
        NOWCAST_SPARKLE_PUBLIC_KEY: ""
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: "$(NOWCAST_DEVELOPMENT_TEAM)"
    dependencies:
      - package: Sparkle
        product: Sparkle
      - package: GRDB
        product: GRDB
      - package: FeedKit
        product: FeedKit
schemes:
  Nowcast:
    build:
      targets:
        Nowcast: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
