name: Nowcast
options:
  bundleIdPrefix: com.jfive-ai
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.11.0"
  FeedKit:
    url: https://github.com/nmdias/FeedKit
    from: "10.4.0"
targets:
  Nowcast:
    type: application
    platform: macOS
    sources:
      - path: Nowcast
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Nowcast/Resources
    info:
      path: Nowcast/Resources/Info.plist
      properties:
        CFBundleName: Nowcast
        CFBundleDisplayName: Nowcast
        CFBundleShortVersionString: "0.0.1"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.news
        NSHumanReadableCopyright: ""
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: Nowcast/Resources/Nowcast.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jfive-ai.nowcast
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: GRDB
        product: GRDB
      - package: FeedKit
        product: FeedKit
  NowcastTests:
    type: bundle.unit-test
    platform: macOS
    # Compile the production pure-logic files directly into a hostless bundle.
    # Tests never launch AppState, open a user database, or read the Keychain.
    sources:
      - path: NowcastTests
      - path: Nowcast/LLM/ModelPricing.swift
      - path: Nowcast/LLM/LLMClient.swift
      - path: Nowcast/LLM/LLMJSON.swift
      - path: Nowcast/Pipeline/SourceReliability.swift
      - path: Nowcast/Pipeline/BigStoryScorer.swift
      - path: Nowcast/Pipeline/BriefDiff.swift
      - path: Nowcast/Audio/SpeechScript.swift
      - path: Nowcast/Storage/URLCanonicalizer.swift
      - path: Nowcast/Models/DeliveryChannel.swift
      - path: Nowcast/Models/BriefingResult.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jfive-ai.nowcast.tests
        TEST_HOST: ""
        CODE_SIGN_ENTITLEMENTS: ""
schemes:
  Nowcast:
    build:
      targets:
        Nowcast: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [NowcastTests]
    archive:
      config: Release
  NowcastTests:
    build:
      targets:
        NowcastTests: all
    test:
      config: Debug
      targets: [NowcastTests]
